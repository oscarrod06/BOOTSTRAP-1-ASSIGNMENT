
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Responsive Web Layout - Second Layout</title>
  
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #34404b;
      overflow-x: hidden;
    }
    
    .page-layout {
      display: grid;
      grid-template-columns: 25% 75%;
      width: 100%;
      height: 100vh;
      min-height: 400px;
      padding: 5px 18px 18px;
      gap: 0;
    }
    
    .navigation {
      background-color: #0d6efd;
      padding: 4px 11px;
      min-width: 0;
    }
    
    .main-content {
      display: grid;
      grid-template-rows: 25% 1fr;
      min-width: 0;
      min-height: 0;
    }
    
    .header {
      background-color: #6c757d;
      padding: 4px 12px;
    }
    
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 24px 19% 1fr;
      min-height: 0;
      min-width: 0;
    }
    
    .article-label {
      grid-column: 1;
      grid-row: 1;
      background-color: #ffc107;
      padding: 2px 12px;
    }
    
    .aside {
      grid-column: 2;
      grid-row: 1 / 4;
      background-color: #198754;
      padding: 4px 12px;
      min-height: 0;
    }
    
    .footer {
      grid-column: 1;
      grid-row: 2;
      background-color: #6c757d;
      padding: 4px 12px;
    }
    
    .article-content {
      grid-column: 1;
      grid-row: 3;
      background-color: #ffc107;
      min-height: 0;
    }
    
    @media (max-width: 767.98px) {
      .page-layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: auto;
        min-height: 100vh;
        padding: 8px;
        gap: 8px;
      }

      .navigation {
        min-height: 60px;
      }

      .main-content {
        grid-template-rows: minmax(110px, 22vh) minmax(420px, 1fr);
      }

      .content-grid {
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 24px 100px minmax(220px, 1fr);
      }
    }
    
    @media (max-width: 480px) {
      .page-layout {
        padding: 8px;
      }

      .main-content {
        grid-template-rows: 100px 1fr;
      }

      .content-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 24px 100px minmax(180px, 1fr) 140px;
      }

      .article-label {
        grid-column: 1;
        grid-row: 1;
      }

      .footer {
        grid-column: 1;
        grid-row: 2;
      }

      .article-content {
        grid-column: 1;
        grid-row: 3;
      }

      .aside {
        grid-column: 1;
        grid-row: 4;
      }
    }
  </style>
</head>

<body>

  <div class="page-layout">

    
    <nav class="navigation">
      Navigation
    </nav>
    
    <main class="main-content">
      
      <header class="header">
        Header
      </header>
      
      <div class="content-grid">

        <section class="article-label">
          Article
        </section>

        <aside class="aside">
          Aside
        </aside>

        <footer class="footer">
          Footer
        </footer>

        <section class="article-content"
                 aria-label="Article content area">
        </section>

      </div>
    </main>
  </div>

</body>
</html>
